name: Feature Pipeline Infra

on:
  push:
    branches: [feature/*]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false

  create-pr:
    name: Criar PR para Main
    runs-on: ubuntu-latest
    needs: validate
    if: always() && needs.validate.result != 'failure'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Criar Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR ja existe para branch $BRANCH"
          else
            gh pr create \
              --title "Merge $BRANCH para main" \
              --body "PR criado automaticamente pela pipeline apos terraform fmt/validate/plan passarem." \
              --base main \
              --head "$BRANCH"
            echo "PR criado com sucesso."
          fi
