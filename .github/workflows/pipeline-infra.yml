name: Pipeline Infra Base

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STATE_BUCKET: mechanical-hub-tfstate

jobs:
  config:
    name: Ler Configuracao
    runs-on: ubuntu-latest
    outputs:
      destroy: ${{ steps.read-config.outputs.destroy }}
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Ler flag de destroy
        id: read-config
        run: |
          source infra/pipeline.conf
          echo "destroy=$DESTROY" >> $GITHUB_OUTPUT

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: config
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Criar bucket S3 do state (idempotente)
        run: |
          aws s3api head-bucket --bucket ${{ env.STATE_BUCKET }} 2>/dev/null \
            || aws s3 mb s3://${{ env.STATE_BUCKET }} --region ${{ env.AWS_REGION }}

      - name: Ativar versionamento do bucket do state
        run: |
          aws s3api put-bucket-versioning \
            --bucket ${{ env.STATE_BUCKET }} \
            --versioning-configuration Status=Enabled

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Destroy
        if: needs.config.outputs.destroy == 'true'
        working-directory: infra
        run: terraform destroy -auto-approve

      - name: Terraform Apply
        if: needs.config.outputs.destroy == 'false'
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Mostrar outputs
        if: needs.config.outputs.destroy == 'false'
        working-directory: infra
        run: terraform output
